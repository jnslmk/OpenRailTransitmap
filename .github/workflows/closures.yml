name: Log construction closures

# The archive job. DB InfraGO's strecken.info serves the construction plan as it
# stands right now and nothing before it, and nobody publishes a history of it
# (docs/closures.md, "Looking for a historical source") - so this reads the plan
# once a day and appends what changed to data/closure-log.jsonl. Miss a day and
# that day's plan is simply gone, which is why this is its own scheduled job
# rather than a step of the nightly map build.
#
# It is also the only job in this repository that writes to the repository, and
# it is scoped to exactly that: `contents: write` here, `contents: read` in
# build.yml, which still cannot push anything it computes.

on:
  schedule:
    # 03:30 UTC, half an hour before the map build. The push this makes is what
    # normally triggers that build, so the map is drawn from the same reading of
    # the plan the log just recorded; build.yml's own 04:00 schedule remains as
    # the fallback for a day when nothing changed and nothing was pushed.
    - cron: '30 3 * * *'
  workflow_dispatch:

# A second run starting while the first is still pushing would append to a stale
# log and lose the race. There is nothing to be gained by cancelling either, so
# the newer run waits.
concurrency:
  group: closure-log
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Read the plan and append what changed
        run: npx tsx pipeline/closures.ts --log

      - name: Commit the day's events
        run: |
          if git diff --quiet -- data/closure-log.jsonl; then
            echo "no change to the log"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/closure-log.jsonl
          git commit -m "Log the construction plan as it stands on $(date -u +%F)"
          # Another run may have pushed between checkout and here; rebasing onto
          # it is always correct for an append-only file.
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** attempt))
          done
          echo "could not push the log after four attempts" >&2
          exit 1
